<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" />
  
  <!-- uDiscovery Activity Curve Emblem -->
  <path d="M 160 160
           L 160 280
           A 96 96 0 0 0 352 280
           L 352 160" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="44" 
        stroke-linecap="round" />
        
  <!-- Pulse Activity Accent inside 'u' -->
  <path d="M 120 256 L 190 256 L 225 180 L 265 320 L 305 230 L 335 256 L 392 256" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />
</svg>